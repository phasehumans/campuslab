name: Deploy to Production EC2

on:
    workflow_dispatch: # Manual trigger only: will never run automatically on git push

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    build-and-push:
        name: Build & Push Images (GHCR)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & Push API Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: server/Dockerfile
                  push: true
                  tags: ghcr.io/phasehumans/campuslab-api:latest
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Build & Push Judge Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: judge/Dockerfile
                  push: true
                  tags: ghcr.io/phasehumans/campuslab-judge:latest
                  cache-from: type=gha,scope=judge
                  cache-to: type=gha,mode=max,scope=judge

    deploy:
        name: Deploy to EC2
        needs: build-and-push
        runs-on: ubuntu-latest
        environment:
            name: Production (AWS)
            url: https://labapi.trydecember.com/health
        permissions:
            contents: read
            deployments: write

        steps:
            - name: Deploy to EC2 over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER || 'ubuntu' }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  port: 22
                  script_stop: true
                  script: |
                      echo "==> Pulling latest repository changes..."
                      cd /var/www/campuslab
                      git fetch origin main
                      git reset --hard origin/main

                      echo "==> Logging in to GHCR..."
                      echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      echo "==> Pulling pre-built images from GHCR..."
                      sudo docker compose -f docker-compose.prod.yml pull

                      echo "==> Restarting production services..."
                      sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans

                      echo "==> Cleaning up dangling images..."
                      sudo docker image prune -f

                      echo "==> Verifying local API health check..."
                      sleep 5
                      curl -f http://127.0.0.1:3000/health || exit 1
                      echo "==> CampusLab services deployed successfully!"

            - name: Verify Public HTTPS Healthcheck
              run: |
                  echo "==> Verifying public HTTPS API health..."
                  curl -f --retry 5 --retry-delay 3 https://labapi.trydecember.com/health
                  echo "==> Production API is live and healthy!"
